  - type: cron
    name: chitrabodh-pilot-cleanup
    runtime: docker
    branch: dev
    region: oregon
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node scripts/render-start.mjs cleanup
    autoDeployTrigger: 'off'
    schedule: '*/5 * * * *'
    envVars:
      - key: MONGODB_URI
        fromService:
          name: chitrabodh-pilot-web
          type: web
          envVarKey: MONGODB_URI
      - key: FILEBASE_ACCESS_KEY_ID
        fromService:
          name: chitrabodh-pilot-web
          type: web
          envVarKey: FILEBASE_ACCESS_KEY_ID
      - key: FILEBASE_SECRET_ACCESS_KEY
        fromService:
          name: chitrabodh-pilot-web
          type: web
