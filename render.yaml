          envVarKey: MONGODB_URI
      - key: GEMINI_API_KEY
        fromService:
          name: chitrabodh-pilot-web
          type: web
          envVarKey: GEMINI_API_KEY
      - key: GEMINI_MODEL
        fromService:
          name: chitrabodh-pilot-web
          type: web
          envVarKey: GEMINI_MODEL
      - key: GEMINI_FALLBACK_MODELS
        fromService:
          name: chitrabodh-pilot-web
          type: web
          envVarKey: GEMINI_FALLBACK_MODELS
      - key: AI_PROVIDER
        fromService:
          name: chitrabodh-pilot-web
          type: web
          envVarKey: AI_PROVIDER
      - key: GEMINI_API
        fromService:
          name: chitrabodh-pilot-web
          type: web
          envVarKey: GEMINI_API
      - key: CHITRABODH_PUBLIC_URL
        fromService:
          name: chitrabodh-pilot-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
  - type: worker
    name: chitrabodh-pilot-publishing
    runtime: docker
    branch: dev
    region: oregon
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node scripts/render-start.mjs publishing
    autoDeployTrigger: 'off'
    numInstances: 1
    maxShutdownDelaySeconds: 300
    envVars:
      - key: MONGODB_URI
        fromService:
          name: chitrabodh-pilot-web
          type: web
          envVarKey: MONGODB_URI
      - key: FILEBASE_ACCESS_KEY_ID
        fromService:
          name: chitrabodh-pilot-web
          type: web
          envVarKey: FILEBASE_ACCESS_KEY_ID
      - key: FILEBASE_SECRET_ACCESS_KEY
        fromService:
          name: chitrabodh-pilot-web
          type: web
          envVarKey: FILEBASE_SECRET_ACCESS_KEY
      - key: FILEBASE_BUCKET
        fromService:
          name: chitrabodh-pilot-web
          type: web
          envVarKey: FILEBASE_BUCKET
      - key: REGION
        fromService:
          name: chitrabodh-pilot-web
          type: web
          envVarKey: REGION
      - key: FILEBASE_ENDPOINT
        fromService:
          name: chitrabodh-pilot-web
          type: web
          envVarKey: FILEBASE_ENDPOINT
      - key: INSTAGRAM_APP_ID
        fromService:
          name: chitrabodh-pilot-web
          type: web
          envVarKey: INSTAGRAM_APP_ID
      - key: INSTAGRAM_APP_SECRET
        fromService:
          name: chitrabodh-pilot-web
          type: web
